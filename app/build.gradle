plugins {
    alias(libs.plugins.android.application)
}

android {
    lintOptions {
       disable 'UnsafeOptInUsageError'
    }
    namespace 'com.envisionate.musicinfolders'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    buildFeatures {
        buildConfig true
        compose false
        aidl true
    }

    defaultConfig {
        applicationId "com.envisionate.musicinfolders"
        minSdk 30
        targetSdk 36
        versionCode 7
        versionName "7.0"
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('MMMM d yyyy')}\""
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}

dependencies {

    implementation libs.androidx.appcompat
    implementation libs.androidx.car.app
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.documentfile

    implementation libs.material

    implementation "androidx.media3:media3-exoplayer:1.10.1"
    implementation 'androidx.media3:media3-ui:1.10.1'

    // These are for implementing MediaPlaybackTemplate - which I think is not supported yet anyway
    //implementation 'androidx.core:core:1.8.0'
    //implementation 'androidx.media:media:1.6.0'


}